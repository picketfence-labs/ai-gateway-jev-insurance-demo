name: ai-gateway-jev-insurance-demo

services:
  ai-gateway:
    image: kong/kong-ai-gateway:2.2.0
    environment:
      KONG_ROLE: data_plane
      KONG_DATABASE: "off"
      KONG_KONNECT_MODE: "on"
      KONG_CLUSTER_MTLS: pki
      KONG_CLUSTER_CONTROL_PLANE: ${KONNECT_CP_HOST:-replace-with-konnect-control-plane.invalid:443}
      KONG_CLUSTER_SERVER_NAME: ${KONNECT_CP_SERVER_NAME:-replace-with-konnect-control-plane.invalid}
      KONG_CLUSTER_TELEMETRY_ENDPOINT: ${KONNECT_TELEMETRY_HOST:-replace-with-konnect-telemetry.invalid:443}
      KONG_CLUSTER_TELEMETRY_SERVER_NAME: ${KONNECT_TELEMETRY_SERVER_NAME:-replace-with-konnect-telemetry.invalid}
      KONG_CLUSTER_CERT: /etc/kong/certs/cluster.crt
      KONG_CLUSTER_CERT_KEY: /etc/kong/certs/cluster.key
    ports:
      - "127.0.0.1:${AI_GATEWAY_HOST_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ${KONNECT_DP_CERT_PATH:-./certs/cluster.crt}
        target: /etc/kong/certs/cluster.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${KONNECT_DP_KEY_PATH:-./certs/cluster.key}
        target: /etc/kong/certs/cluster.key
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      # Kongプロセスの稼働確認のみ。Konnect登録や接続成功は証明しません。
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [demo]

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    environment:
      NODE_ENV: production
      DEMO_MODE: "${DEMO_MODE:-offline}"
      LIVE_ACCESS_APPROVED: "${LIVE_ACCESS_APPROVED:-false}"
      LIVE_UI_ENABLED: "${LIVE_UI_ENABLED:-false}"
      AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      AI_GATEWAY_MODEL: ${AI_GATEWAY_MODEL:-}
      AI_GATEWAY_TIMEOUT_MS: ${AI_GATEWAY_TIMEOUT_MS:-}
      AI_GATEWAY_JEV_URL: ${AI_GATEWAY_JEV_URL:-}
      AI_GATEWAY_JEV_API_KEY: ${AI_GATEWAY_JEV_API_KEY:-}
      AI_GATEWAY_JEV_MODEL: ${AI_GATEWAY_JEV_MODEL:-}
      AI_GATEWAY_JEV_TIMEOUT_MS: ${AI_GATEWAY_JEV_TIMEOUT_MS:-}
      MCP_CUSTOMER_URL: ${MCP_CUSTOMER_URL:-}
      MCP_PRODUCT_URL: ${MCP_PRODUCT_URL:-}
      MCP_APPLICATION_URL: ${MCP_APPLICATION_URL:-}
      MCP_CLAIM_URL: ${MCP_CLAIM_URL:-}
      MCP_POLICY_URL: ${MCP_POLICY_URL:-}
      MCP_API_KEY: ${MCP_API_KEY:-}
      MCP_TIMEOUT_MS: ${MCP_TIMEOUT_MS:-}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      - ai-gateway
      - product-api
      - customer-api
      - application-api
      - policy-api
      - claim-api
    networks: [demo]

  product-api:
    <<: &insurance-api
      platform: linux/amd64
      expose: ["8000"]
      networks: [demo]
    image: ghcr.io/picketfence-labs/insurance-product:v0.1.3@sha256:1b9b2a7973b963fbb24862a3133f8b181a41b9720b45d8d0c8ee6e3a664232a0
  customer-api:
    <<: *insurance-api
    image: ghcr.io/picketfence-labs/insurance-customer:v0.1.3@sha256:e60419e0b7993be4f4c6a3c249db2d75e57beb4d6c8787788e40ed1c9a04c84c
  application-api:
    <<: *insurance-api
    image: ghcr.io/picketfence-labs/insurance-application:v0.1.3@sha256:4202e7b58a725a37590246478c30a05541efce9b3eb4b070a027903cdb738e2a
  policy-api:
    <<: *insurance-api
    image: ghcr.io/picketfence-labs/insurance-policy:v0.1.3@sha256:f976723fdd440890a7e175d10324b02fc42fa01498b9cb0b230ec6ba52b96e2e
  claim-api:
    <<: *insurance-api
    image: ghcr.io/picketfence-labs/insurance-claim:v0.1.3@sha256:1ec0bad0706a2e2e39b11089e56ad0423f34e5a309ac91dded4c8c46e7dea160

networks:
  demo:
    driver: bridge
